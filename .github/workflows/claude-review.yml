name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
      - name: 실험용 결과 기록
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_OUT: ${{ steps.claude.outputs.execution_file }}
        run: |
          EXEC="${EXEC_OUT:-$RUNNER_TEMP/claude-execution-output.json}"
          {
            echo "### [실험 기록] 리뷰 실행 결과"
            echo "exec=$EXEC"; ls -la "$RUNNER_TEMP" | head -20; jq 'length' "$EXEC" 2>&1 | head -3
            echo '```'
            jq -r '[.[] | select(.type=="result")][-1] | "subtype=\(.subtype) turns=\(.num_turns) cost=\(.total_cost_usd)\n\(.result)"' "$EXEC" | head -c 20000
            echo '```'
            echo "### 도구 호출"
            echo '```'
            jq -r '.[] | select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | "\(.name) \(.input | tostring | .[0:160])"' "$EXEC" | head -80
            echo '```'
            echo "### 거부된 도구"
            echo '```'
            jq -r '[.[] | select(.type=="result")][-1].permission_denials // [] | .[] | tostring' "$EXEC" | head -20
            echo '```'
          } > /tmp/r.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/r.md
