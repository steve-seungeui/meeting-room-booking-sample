name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_SYNC_PLUGIN_INSTALL: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "extraKnownMarketplaces": {
                "org-plugins": {
                  "source": {
                    "source": "git",
                    "url": "https://github.com/steve-seungeui/org-plugins-sample.git",
                    "ref": "ch12/github-issues"
                  }
                }
              },
              "enabledPlugins": {
                "dev-standard@org-plugins": true,
                "github-issues@org-plugins": true
              }
            }
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(npm test),Bash(npm run typecheck)"
